name: skillcubes
description: "Cognitive assessment & interview test prep — SkillCubes"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  http: ^1.2.2
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App icon generated from SkillCubes logo
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/skillcubes_logo.png"
  adaptive_icon_background: "#0A192F"
  adaptive_icon_foreground: "assets/images/skillcubes_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/skillcubes_logo.png
    - assets/translations/
